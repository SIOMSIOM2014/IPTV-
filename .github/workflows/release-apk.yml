name: Publish IPTV WORLD APK
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-apk.yml'
      - 'android/**'
      - 'player.html'
      - 'android/app/build.gradle'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.IPTV_RELEASE_KEYSTORE_BASE64 }}
      IPTV_RELEASE_STORE_PASSWORD: ${{ secrets.IPTV_RELEASE_STORE_PASSWORD }}
      IPTV_RELEASE_KEY_ALIAS: ${{ secrets.IPTV_RELEASE_KEY_ALIAS }}
      IPTV_RELEASE_KEY_PASSWORD: ${{ secrets.IPTV_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare app icon resources
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          curl -fL 'https://raw.githubusercontent.com/SIOMSIOM2014/IPTV-/main/icon-512.png' -o /tmp/icon.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          src=Image.open('/tmp/icon.png').convert('RGBA')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,size in sizes.items():
              src.resize((size,size),Image.Resampling.LANCZOS).save(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
          PY
      - name: Build permanently signed release APK when signing secrets are configured
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iptv-world-release.jks"
          cd android
          IPTV_RELEASE_STORE_FILE="$RUNNER_TEMP/iptv-world-release.jks" gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk ../IPTV-WORLD.apk
          cd ..
          echo "APK_KIND=release-signed" >> "$GITHUB_ENV"
      - name: Build test APK when no permanent signing key is configured
        if: env.RELEASE_KEYSTORE_BASE64 == ''
        run: |
          cd android
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/*.apk ../IPTV-WORLD.apk
          cd ..
          echo "APK_KIND=debug-test" >> "$GITHUB_ENV"
      - name: Prepare checksum
        run: |
          sha256sum IPTV-WORLD.apk > IPTV-WORLD.apk.sha256
      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v2.1.0-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: IPTV WORLD Android v2.1 (build ${{ github.run_number }}.${{ github.run_attempt }})
          prerelease: true
          draft: true
          generateReleaseNotes: true
          artifacts: "IPTV-WORLD.apk,IPTV-WORLD.apk.sha256"
          artifactErrorsFailBuild: true
          body: |
            Automated Android build of IPTV WORLD from the repository source.
            Build type: ${{ env.APK_KIND }}. A permanently signed release is produced only when the four IPTV_RELEASE_* GitHub Actions secrets are configured. Otherwise this is a debug test build. The app currently loads its web player and can hand stream URLs to an installed external player. Internet access is required.
            Install only if you trust this source. Verify the SHA-256 checksum using the accompanying file.
      - name: Publish draft after assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v2.1.0-build-${{ github.run_number }}-${{ github.run_attempt }}" --draft=false
