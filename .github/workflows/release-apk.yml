name: Publish IPTV WORLD APK
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-apk.yml'
      - 'android/**'
      - 'player.html'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.IPTV_RELEASE_KEYSTORE_BASE64 }}
      IPTV_RELEASE_STORE_PASSWORD: ${{ secrets.IPTV_RELEASE_STORE_PASSWORD }}
      IPTV_RELEASE_KEY_ALIAS: ${{ secrets.IPTV_RELEASE_KEY_ALIAS }}
      IPTV_RELEASE_KEY_PASSWORD: ${{ secrets.IPTV_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare app icon resources
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          curl -fL 'https://raw.githubusercontent.com/SIOMSIOM2014/IPTV-/main/icon-512.png' -o /tmp/icon.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          src=Image.open('/tmp/icon.png').convert('RGBA')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,size in sizes.items():
              src.resize((size,size),Image.Resampling.LANCZOS).save(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
          PY
      - name: Validate permanent signing key
        id: signing
        shell: bash
        run: |
          set +e
          KEY_FILE="$RUNNER_TEMP/iptv-world-release.jks"
          VALID=false
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$IPTV_RELEASE_STORE_PASSWORD" && -n "$IPTV_RELEASE_KEY_ALIAS" && -n "$IPTV_RELEASE_KEY_PASSWORD" ]]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEY_FILE" 2>/dev/null
            if [[ $? -eq 0 && -s "$KEY_FILE" ]]; then
              keytool -list -keystore "$KEY_FILE" -storepass "$IPTV_RELEASE_STORE_PASSWORD" -alias "$IPTV_RELEASE_KEY_ALIAS" >/dev/null 2>&1
              if [[ $? -eq 0 ]]; then VALID=true; fi
            fi
          fi
          echo "valid=$VALID" >> "$GITHUB_OUTPUT"
          if [[ "$VALID" == "true" ]]; then
            echo "A valid signing key was found."
          else
            echo "::warning::Signing secrets are missing or invalid. Building a debug/test APK instead; it is not suitable for Play Store release."
          fi
      - name: Build permanently signed release APK
        if: steps.signing.outputs.valid == 'true'
        run: |
          cd android
          IPTV_RELEASE_STORE_FILE="$RUNNER_TEMP/iptv-world-release.jks" gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk ../IPTV-WORLD.apk
          cd ..
          echo "APK_KIND=release-signed" >> "$GITHUB_ENV"
      - name: Build test APK when signing key is unavailable
        if: steps.signing.outputs.valid != 'true'
        run: |
          cd android
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/*.apk ../IPTV-WORLD.apk
          cd ..
          echo "APK_KIND=debug-test" >> "$GITHUB_ENV"
      - name: Prepare checksum
        run: sha256sum IPTV-WORLD.apk > IPTV-WORLD.apk.sha256
      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v2.1.0-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: IPTV WORLD Android v2.1 (build ${{ github.run_number }}.${{ github.run_attempt }})
          prerelease: true
          draft: true
          generateReleaseNotes: true
          artifacts: "IPTV-WORLD.apk,IPTV-WORLD.apk.sha256"
          artifactErrorsFailBuild: true
          body: |
            Automated Android build of IPTV WORLD from the repository source.
            Build type: ${{ env.APK_KIND }}.
            A release-signed APK is produced only when all four signing secrets are valid. If validation fails, the attached APK is a debug/test build and must not be submitted to Google Play.
            Internet access is required. Verify the SHA-256 checksum using the accompanying file.
      - name: Publish draft after assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v2.1.0-build-${{ github.run_number }}-${{ github.run_attempt }}" --draft=false
