plugins {
    id 'com.android.application'
}
android {
    namespace 'com.iptvworld.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.siomsiom2014.iptvworld2026'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }
    signingConfigs {
        release {
            def storePath = System.getenv('IPTV_RELEASE_STORE_FILE')
            if (storePath != null && !storePath.isEmpty()) {
                storeFile file(storePath)
                storePassword System.getenv('IPTV_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('IPTV_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('IPTV_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('IPTV_RELEASE_STORE_FILE') != null && !System.getenv('IPTV_RELEASE_STORE_FILE').isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
